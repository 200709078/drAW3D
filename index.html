<!DOCTYPE html>
<html lang="tr">

<head>
	<title>drAW3D | mADEMatik</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="keywords" content="Geometri, 3B, açınım, prizma, piramit, silindir, koni, drAW2D, drAW3D">
	<meta name="description" content="made by mADEMatik">
	<meta name="author" content="made by mADEMatik">
	<link rel="icon" type="image/png" href="img/favicon.png" />
	<!-- Stiller ilk çizimden önce yüklenir; JavaScript'ten eklenince simgeler bir an doğal boyutlarında görünür. -->
	<link rel="stylesheet" href="/src/styles/toolbar.css" />
	<link rel="stylesheet" href="/src/styles/styles.css" />
	<link rel="stylesheet" href="/src/styles/titlebar.css" />
</head>

<body>
	<div id="centerWrapper">
		<div id="mainToolbar" class="main-toolbar" role="toolbar" aria-label="Araçlar" data-action="select">
			<button id="currentTool" class="toolbar-button current-tool" type="button" title="Araçlar"></button>
			<div id="toolGroups" class="tool-groups"></div>
			<div class="toolbar-actions">
				<button type="button" id="fileMenuButton" class="toolbar-button" title="Dosya">
					<img src="./img/file.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="undo" class="toolbar-button" title="Geri Al" disabled>
					<img src="./img/undo.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="redo" class="toolbar-button" title="Yinele" disabled>
					<img src="./img/redo.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="delete" class="toolbar-button" title="Sil" disabled>
					<img src="./img/delete.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="hide" class="toolbar-button" title="Gizle" disabled>
					<img src="./img/hide.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="showAll" class="toolbar-button" title="Tümünü Göster" disabled>
					<img src="./img/show.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="groundToggle" class="toolbar-button" title="Düzlemi Gizle">
					<img src="./img/grid.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="standardView" class="toolbar-button" title="Standart Görünüm">
					<img src="./img/default.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="viewMenuButton" class="toolbar-button" title="Görünüm">
					<img src="./img/view.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="helpMenuButton" class="toolbar-button" title="Yardım">
					<img id="btnimgHelpMenu" src="./img/help.svg" width="26" height="26" alt="">
				</button>
				<button type="button" id="btnCalc" class="toolbar-button" title="Paneli Gizle">
					<img id="btnimgCalc" src="./img/arrow.svg" width="26" height="26" alt="">
				</button>
			</div>
		</div>
		<div id="viewport">
			<canvas id="scene"></canvas>
			<div id="sceneLabels" class="scene-labels" aria-hidden="true"></div>
		</div>
		<div class="rightWrapper" id="rightWrapper">
			<div class="reSizer"></div>
			<!-- Dar ekranda alt panel nesneler ile araçlar arasında geçiş yapar. -->
			<div class="panel-tabs" role="tablist" aria-label="Panel">
				<button type="button" id="tabAlgebra" class="panel-tab" role="tab" aria-selected="true" aria-controls="scrollWrapper">Cebir</button>
				<button type="button" id="tabTools" class="panel-tab" role="tab" aria-selected="false" aria-controls="toolsPanel">Araçlar</button>
			</div>
			<div id="toolsPanel" class="tools-panel" role="tabpanel" hidden></div>
			<div id="scrollWrapper">
				<div class="expr-block-giris">
					<input id="giris" placeholder="Giriş" title="Giriş" value="" autocomplete="off" spellcheck="false">
					<button type="button" id="keyboardToggle" class="keyboard-toggle" title="Matematik klavyesi" aria-pressed="false"
						aria-controls="mathKeyboard"><img src="./img/keyboard.svg" width="20" height="20" alt=""></button>
				</div>
				<hr>
				<div id="objectsContainer"></div>
			</div>
		</div>
		<div id="objectControls" class="object-controls" hidden>
			<label id="sideControl" class="object-control" hidden>
				<span>Kenar Sayısı: <output id="sideValue">4</output></span>
				<input id="sideSlider" type="range" min="3" max="20" value="4" step="1">
			</label>
			<label id="unfoldControl" class="object-control" hidden>
				<span>Açınım: <output id="unfoldValue">0</output>° <button type="button" id="unfoldPlay" class="unfold-play" title="Oynat">▶</button></span>
				<input id="unfoldSlider" type="range" min="0" max="90" value="0" step="1">
			</label>
		</div>
	</div>
	<div id="snackbar" class="tool-toast" role="status" aria-live="polite">
		<strong id="snackTitle" class="tool-toast-title"></strong>
		<span id="snackContent" class="tool-toast-message"></span>
	</div>
	<!-- Yardım Penceresi -->
	<div class="help-popup" id="help-popup">
		<div class="help-content">
			<div id="help-header">
				<h2>drAW3D Yardım</h2>
				<button class="help-close" type="button" title="Kapat">&times;</button>
			</div>
			<div class="help-section">
				<h3>Giriş Alanı Komutları</h3>
				<!-- Konular ve örnekler src/commands/language.ts tablosundan üretilir. -->
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
